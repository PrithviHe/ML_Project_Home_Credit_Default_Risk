[project]
name = "ds-ml-project-template"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # Data handling
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "jinja2>=3.1.0",

    # Visualization
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "plotly>=6.8.0",

    # Machine Learning
    "scikit-learn>=1.9.0",
    "xgboost>=3.0.0",
    "imbalanced-learn>=0.14.0",

    # Explainability
    "shap>=0.48.0",

    # Jupyter
    "jupyter>=1.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbformat>=5.10.4",
]